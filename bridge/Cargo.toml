[package]
name = "wled-matter"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "wled_matter"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
if-addrs = "0.15"
async-io = "2"
blocking = "1"
futures-lite = "2"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
async-signal = "0.2"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rs-matter = { path = "../tools/rs-matter/rs-matter", features = ["async-io", "groups", "persistent-subscriptions", "max-groups-per-fabric-12", "max-group-keys-per-fabric-3", "max-group-endpoints-per-fabric-3", "max-sessions-32"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
